name: Build README

# README.md is generated, never edited by hand. Rebuilds happen when:
#   * "Resolve Research Area" dispatches this workflow after committing markers
#     (a GITHUB_TOKEN push cannot trigger push-based workflows by itself), or
#   * a human pushes/edits a marker or a .bib directly.
#
# The PDF -> BibTeX generator is wired in here as a READ-ONLY check. Generation
# happens in the local pre-commit hook so that a PDF and its .bib share one
# commit; this job must never create files it does not commit.
on:
  push:
    branches: [main]
    paths:
      - 'papers/**/*.research-area'
      - 'papers/**/*.bib'
  workflow_dispatch:

permissions:
  contents: write

# Serialise the push-triggered run and the dispatched run so that two jobs
# never try to push at the same time. The second run sees no diff and skips.
concurrency:
  group: build-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history keeps the rebase-on-conflict retry below usable.
          fetch-depth: 0

      - name: Sync with the latest main
        run: |
          git fetch origin main
          git checkout -B ci-work origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Report PDFs without a .bib (read-only)
        # Does not write or stage anything. The hard gate lives in the resolve
        # workflow; here it is just visible in the log.
        run: python3 scripts/pdf_to_bib.py --check

      - name: Aggregate by research area
        run: python3 scripts/build_readme.py

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README.md is already up to date."
          else
            git commit -m "[skip ci] docs: rebuild README from paper index"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              echo "push rejected (attempt $attempt); rebasing on latest main"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; break; }
              sleep 3
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::could not push the rebuilt README.md"
              exit 1
            fi
          fi
